  - id: marchetti-4th-1972
    citation: 466 F.2d 1309
    name: United States v. Marchetti
    outcome: restricted
    coding: model_draft
    coded_by: ""
    citation_source: cap-static.case.law
    note: >
      Prepublication review enforced against a former intelligence officer on a contractual
      theory. DRAFT: the secrecy agreement, not the content, is the operative fact and no
      axis holds it. That is also why `restriction_type` is now `undetermined`: the court
      analysed a secrecy agreement and a fiduciary relation, not a speech regulation, so
      neither `content_based` nor `incidental` describes what was upheld. `harm_proximity`
      stays `foreseeable` on the court's own words -- "the risk of harm from disclosure is
      so great". RECORD SILENT on `capability_tier`.
      Both blanks are `inapplicable` rather than silences. The court analysed a secrecy
      agreement and a fiduciary relation, so `restriction_type` has no value here -- neither
      `content_based` nor `incidental` describes enforcing a contract -- and an account of
      Agency operations has no capability tier. Reading further will not fill either in.
    features:
      distribution_modality: paper
      actor_type: hobbyist
      capability_tier: inapplicable
      post_release_modification: none
      harm_proximity: foreseeable
      jurisdiction: us_federal
      restriction_type: inapplicable
      forum: journal

