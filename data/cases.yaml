  - id: deemed-export-rule
    citation: 15 C.F.R. 734.13
    name: Export - release of technology or source code to a foreign person
    outcome: restricted
    coding: model_draft
    coded_by: ""
    citation_source: cfr-not-in-cap
    note: >
      Not a case and not in CAP; citation not machine-confirmed. The rule the deemed_export
