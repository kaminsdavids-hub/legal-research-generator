  # --- prior restraint on publication --------------------------------------
  - id: pentagon-papers-1971
    citation: 403 U.S. 713
    name: New York Times Co. v. United States
    outcome: permitted
    coding: model_draft
    coded_by: ""
    citation_source: cap-static.case.law
    note: >
      Per curiam: the Government "carries a heavy burden of showing justification" and did
      not meet it. RECORD SILENT on three axes, which drops this below the determinacy
      floor -- and that is the honest description of a three-paragraph per curiam. It
      allocated a burden and decided nothing else; the six concurrences that discuss harm
      and content command no majority, and a coding may not launder a concurrence into a
      holding. `harm_proximity` was `foreseeable`, which inverted the result.
      `capability_tier` is `inapplicable`, not merely unstated: the study was a history of
      decision-making, and a narrative of what officials did has no capability to grade. The
      other two blanks are genuine silences -- the Court could have reached them.
    features:
      distribution_modality: paper
      actor_type: firm
      capability_tier: inapplicable
      post_release_modification: none
      harm_proximity: undetermined
      jurisdiction: us_federal
      restriction_type: undetermined
      forum: journal

  - id: near-1931
    citation: 283 U.S. 697
    name: Near v. Minnesota ex rel. Olson
    outcome: permitted
    coding: model_draft
    coded_by: ""
    citation_source: cap-static.case.law
    note: >
      Prior restraint of a scandal sheet as a public nuisance; the statute reached any
      "malicious, scandalous and defamatory" periodical. RECORD SILENT on
      `capability_tier` and `harm_proximity`: the Court held the statute unconstitutional
      on its face and made no finding about what the Saturday Press would cause.
      `restriction_type: content_based` is kept as a description of a statute that sorted
      publications by what they said, but 1931 predates the content-based/content-neutral
      framework and the opinion never uses it -- an anachronism a human should rule on.
      `capability_tier` is `inapplicable`: a scandal sheet conveys allegations, not a means
      of doing anything, so there is nothing for the axis to measure.
    features:
      distribution_modality: paper
      actor_type: firm
      capability_tier: inapplicable
      post_release_modification: none
      harm_proximity: undetermined
      jurisdiction: us_state
      restriction_type: content_based
