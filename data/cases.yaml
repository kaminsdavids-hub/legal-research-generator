    outcome: permitted
    coding: model_draft
    coded_by: ""
    citation_source: cap-static.case.law
    note: >
      WITHDRAWN on rehearing en banc, 192 F.3d 1308. Coded for exploration only: a
      collision built on it would cite an opinion that was un-issued. Verify the
      withdrawal before ever promoting this record. RECORD SILENT on three axes,
      which is why this now falls below the determinacy floor: the panel wrote that
      it would "limit our attention here, for the most part, to only one" theory --
      prior restraint and its procedural safeguards -- so it never reached whether
      the EAR are content-based, and it recited the "direct, immediate, and
      irreparable damage" standard without applying it. No capability fact appears.
    features:
      distribution_modality: training_code
      actor_type: academic
      capability_tier: undetermined
      post_release_modification: none
      harm_proximity: undetermined
      jurisdiction: us_federal
      restriction_type: undetermined
      forum: journal

