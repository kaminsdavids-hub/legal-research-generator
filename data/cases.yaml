# Real cases coded into the feature schema.
#
# TWO DIFFERENT TRUST QUESTIONS, kept apart on every record:
#
#   citation_source — where the citation came from. Every case below was
#     confirmed against the Caselaw Access Project bulk data (static.case.law):
#     the reporter volume was fetched and the page checked to carry that case
#     name. So the citations are facts, not recollections.
#
#   coding — where the *coding* came from. Every record below is `model_draft`:
#     a model placed the case on these axes and NOBODY HAS CHECKED IT. That is
#     the whole cost of this file, and it is not something fetching can solve.
#     Reading the case and deciding whether it really sits at
#     `harm_proximity: imminent` is scholarship.
#
# CONSEQUENCE: precedent collisions stay switched off. `match_precedents` and
# `graph_adapter.emit_precedents` both refuse an unverified coding, because the
# force of that finding is "your framework misclassifies a decided case", which
# is worth nothing if the coding was guessed. Verify a record — read the case,
# fix the axes, set `coding: model_verified` and `coded_by: <name>` — and it
# starts producing collisions.
#
# TWO KINDS OF BLANK, and they are not the same claim. Both are legal values on
# any axis of a coded case, and both are wildcards in distance, so neither ever
# pushes a case out of matching range.
#
#   undetermined — the source could have said and didn't. A hole in the record.
#     It lowers `determinacy`, and a record answering under 3/4 of its applicable
#     axes cannot anchor a precedent: bernstein-9th-1999 and
#     pentagon-papers-1971 both fall there, each because the court decided one
#     narrow thing and said nothing else. Such a case is reported as a research
#     lead — settle what the record leaves open and it may yet govern.
#
#   inapplicable — the question does not arise. Bartnicki is about an intercepted
#     phone call; there is no artifact whose capability could be graded, and no
#     amount of reading will produce one. So it leaves the determinacy
#     denominator rather than lowering the score, and is never filed as a lead.
#     The guard against abusing that is `applicability`: a case where too many
#     axes do not arise is not incompletely read, it is a case about something
#     this schema does not describe, and the matcher reports it as off-schema.
#
# `capability_tier` is blank on all 15 judicial records, and the split between
# the two blanks is the substantive claim. No opinion grades an artifact on a
# five-point capability scale — the scale postdates them all — but the seven
# cases about a *means of doing something* (encryption code, DeCSS, an H-bomb
# design, a murder manual, terrorist training) have a capability the courts
# happened not to quantify, while the eight about *information* (a policy
# history, a scandal sheet, a memoir, a phone call, a prescriber database, a
# video game, a depiction) have none to quantify. The axis is otherwise carried
# by the two regulatory instruments, which do set thresholds.
#
# WHAT IS NOT HERE, and why. 31 leading First Amendment and export-control
# citations were confirmed; 15 are coded below, alongside 2 regulatory
# instruments whose citations CAP cannot confirm. The rest were dropped because
# this schema is about distributing a technical artifact, and forcing a case
# onto axes it has no position on manufactures data:
#
#   Texas v. Johnson (491 U.S. 397) · R.A.V. v. St. Paul (505 U.S. 377) ·
#   Brandenburg v. Ohio (395 U.S. 444) · Ward v. Rock Against Racism (491 U.S. 781)
#     — expressive conduct or incitement; no distribution modality at all.
#   Turner Broadcasting (512 U.S. 622) · Reno v. ACLU (521 U.S. 844) ·
#   Sable Communications (492 U.S. 115) · Ashcroft v. ACLU (542 U.S. 656) ·
#   Freedman v. Maryland (380 U.S. 51) · City of Lakewood (486 U.S. 750)
#     — carriage, broadcast and licensing; the artifact is not the thing
#       restricted, so `distribution_modality` has no honest value.
#   Golan v. Holder (565 U.S. 302) · Haig v. Agee (453 U.S. 280) ·
#   Va. Pharmacy (425 U.S. 748) · Central Hudson (447 U.S. 557) ·
#   Ashcroft v. Free Speech Coalition (535 U.S. 234)
#     — copyright, travel, and commercial speech; off-axis.
#   United States v. O'Brien (391 U.S. 367)
#     — draft-card burning. Cited by half the opinions below as the framework
#       for an incidental burden, but it distributes nothing, so it belongs in
#       the rules rather than the corpus.
#
# An 8-axis schema fitting 15 of 31 leading cases is itself a finding: the axes
# are tuned to technical-artifact distribution, which is what the project is
# about, and the corpus should not be padded to look bigger than the schema is.

cases:
  # --- code and technical data: the cases nearest the project ---------------
  - id: junger-6th-2000
    citation: 209 F.3d 481
    name: Junger v. Daley
    # Deliberately empty: the Sixth Circuit held source code is protected
    # speech and remanded everything else, so there is no holding on validity
    # for a reading to contradict. `match_precedents` reads an empty outcome as
    # "matches, contradicts nothing", which is exactly the case's posture.
    # Setting `uncertain` here would mark every confident reading as refuted by
    # a case that refuted nothing. See data/reviews/junger-6th-2000.md.
    outcome: ""
    coding: model_draft
    coded_by: ""
    citation_source: cap-static.case.law
    note: >
      Law professor sought to post encryption source code; Sixth Circuit held
      source code is protected expression and remanded for consideration of the
      amended regulations. Checked axis-by-axis against the full opinion —
      review at data/reviews/junger-6th-2000.md — which corrected `outcome`
      (was permitted; nothing was permitted) and `restriction_type` (was
      content_based; the panel framed the analysis under O'Brien intermediate
      scrutiny). Reading the opinion is not the human confirmation
      `model_verified` asserts, so this stays a draft. `capability_tier` and
      `harm_proximity` are `undetermined`: the opinion states no key length or
      algorithm for any of the five programs, and the panel held the record did
      not resolve how proximate the harm was. At 6 of 8 axes answered this
      still clears the determinacy floor for anchoring a precedent.
    features:
      distribution_modality: training_code
      actor_type: academic
      capability_tier: undetermined
      post_release_modification: none
      harm_proximity: undetermined
      jurisdiction: us_federal
      restriction_type: incidental
      forum: public_repository

