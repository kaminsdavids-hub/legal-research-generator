# Netlify site configuration.
#
# The frontend is a static Next.js export; `/api/*` is served by a function that
# holds the backend key server-side (netlify/functions/api-proxy.mts). Routing is
# declared in the function itself via its `config.path`, which is why there is no
# redirect rule here — a [[redirects]] block for /api/* would shadow it.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Environment variables to set in the Netlify UI (never in this file):
#
#   BACKEND_URL         https://host:port of the research backend. Must be
#                       routable from Netlify's servers — a tailnet-only
#                       address will not work, and the proxy says so on failure
#                       rather than returning a bare 502.
#   BACKEND_API_KEY     the backend's LRG_API_KEY. Server-side only; it must
#                       never appear in a NEXT_PUBLIC_* variable, which would
#                       compile it into the public bundle.
#   PROXY_PASSWORD      what a caller must send as X-Proxy-Password. Omit only
#                       if the site is gated another way, in which case set
#                       PROXY_ALLOW_PUBLIC=true so the choice is on the record.
#
# THE TIMEOUT, and how it is handled. Netlify synchronous functions cap at 10s
# by default and 26s at most, while this backend's budget is
# LRG_LLM_TIMEOUT_SECONDS=300. A five-minute request cannot be made to fit, so
# every route that drives a model stopped being a request: POST
# /api/sessions/{id}/jobs returns 202 immediately and the client polls GET
# /api/jobs/{id}. Every call through this proxy is fast by construction.
#
# The original synchronous routes still exist and are correct for a loopback
# client, but they must not be called through this proxy -- they hold a request
# open for the whole step. The frontend uses the job routes exclusively.
# See deploy/README.md.
